<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra-Deck Card Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }
        canvas {
            width: 1024px;
            height: 600px;
            display: block;
            background: #1a1a2e;
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            max-width: 250px;
            font-size: 14px;
        }
        #info h1 {
            margin-bottom: 10px;
            font-size: 20px;
            color: #a0a0ff;
        }
        #info p {
            margin: 4px 0;
            line-height: 1.4;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>Terra-Deck</h1>
        <p>Card Battle Game</p>
        <p>Click cards to attack</p>
    </div>
    
    <div id="canvas-container">
        <canvas id="terradeck-canvas"></canvas>
    </div>

    <script type="module">
        import init, { CanvasApplication } from '../pkg/terradeck_wasm.js';

        async function main() {
            await init();
            const canvasApp = new CanvasApplication('terradeck-canvas');
            
            const canvas = document.getElementById('terradeck-canvas');
            canvas.addEventListener('mousedown', (e) => canvasApp.on_mousedown(e));
            canvas.addEventListener('mouseup', (e) => canvasApp.on_mouseup(e));
            canvas.addEventListener('mousemove', (e) => canvasApp.on_mousemove(e));
            document.addEventListener('keydown', (e) => canvasApp.on_keydown(e));
            
            let lastTime = performance.now();
            let frameCount = 0;
            let lastFpsUpdate = performance.now();
            
            function gameLoop(currentTime) {
                const deltaTime = (currentTime - lastTime) / 1000.0;
                lastTime = currentTime;
                
                canvasApp.update(deltaTime);
                canvasApp.render();
                
                frameCount++;
                if (currentTime - lastFpsUpdate >= 1000) {
                    frameCount = 0;
                    lastFpsUpdate = currentTime;
                }
                
                requestAnimationFrame(gameLoop);
            }
            
            canvasApp.run();
            requestAnimationFrame(gameLoop);
        }

        main().catch(err => {
            console.error('Failed to initialize:', err);
        });
    </script>
</body>
</html>
